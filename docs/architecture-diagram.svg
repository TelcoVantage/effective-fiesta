<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1200" viewBox="0 0 1000 1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#b91c1c"/>
    </marker>
    <style>
      .box{fill:#e0e7ff;stroke:#4338ca;stroke-width:2;rx:10;}
      .state{fill:#dbeafe;stroke:#1d4ed8;stroke-width:2;}
      .dec{fill:#fef9c3;stroke:#a16207;stroke-width:2;}
      .lookup{fill:#fde68a;stroke:#b45309;stroke-width:2;}
      .safe{fill:#fecaca;stroke:#b91c1c;stroke-width:2;}
      .ok{fill:#bbf7d0;stroke:#15803d;stroke-width:2;}
      .dt{fill:#fef3c7;stroke:#b45309;stroke-width:2.5;}
      .cap{fill:#0f172a;font-size:15px;font-weight:600;}
      .sub{fill:#334155;font-size:12.5px;}
      .mono{font-family:Consolas,Menlo,monospace;fill:#1e293b;font-size:12px;}
      .lbl{fill:#475569;font-size:12px;font-weight:600;}
      .edge{stroke:#334155;stroke-width:2;fill:none;}
      .edgeRed{stroke:#b91c1c;stroke-width:2;fill:none;stroke-dasharray:1;}
      .edgeDot{stroke:#b45309;stroke-width:1.6;fill:none;stroke-dasharray:5 4;}
      .title{fill:#0f172a;font-size:22px;font-weight:700;}
      .note{fill:#64748b;font-size:12px;}
    </style>
  </defs>

  <text x="30" y="40" class="title">Dynamic Email Router — Genesys Cloud Inbound Email Flow</text>
  <text x="30" y="62" class="note">One catch-all flow · all routing resolved at runtime from the “Email Routing” data table · add a mailbox = add a row</text>

  <!-- Inbound -->
  <rect x="300" y="90" width="360" height="46" rx="23" class="ok"/>
  <text x="480" y="118" text-anchor="middle" class="cap">Inbound email to ANY address</text>
  <line x1="480" y1="136" x2="480" y2="168" class="edge" marker-end="url(#arrow)"/>

  <!-- Route -->
  <rect x="280" y="170" width="400" height="60" rx="10" class="box"/>
  <text x="480" y="194" text-anchor="middle" class="cap">Inbound Email Route(s)</text>
  <text x="480" y="214" text-anchor="middle" class="sub">Admin ▸ Routing ▸ Email — catch-all domain → this flow</text>
  <line x1="480" y1="230" x2="480" y2="262" class="edge" marker-end="url(#arrow)"/>

  <!-- Initial State normalise -->
  <rect x="250" y="264" width="460" height="72" rx="10" class="state"/>
  <text x="480" y="288" text-anchor="middle" class="cap">Initial State — normalise recipient</text>
  <text x="480" y="308" text-anchor="middle" class="mono">toAddress = ToLower(Trim(Email.Message.to[0].id))</text>
  <text x="480" y="326" text-anchor="middle" class="mono">domain    = "@" + host part</text>
  <line x1="480" y1="336" x2="480" y2="366" class="edge" marker-end="url(#arrow)"/>

  <!-- Data table cylinder (right) -->
  <g>
    <path d="M760 360 a70 16 0 0 0 140 0 l0 150 a70 16 0 0 1 -140 0 z" class="dt"/>
    <ellipse cx="830" cy="360" rx="70" ry="16" class="dt"/>
    <text x="830" y="356" text-anchor="middle" class="cap">Email Routing</text>
    <text x="830" y="374" text-anchor="middle" class="sub">data table</text>
    <text x="830" y="410" text-anchor="middle" class="mono">key</text>
    <text x="830" y="428" text-anchor="middle" class="mono">queueName</text>
    <text x="830" y="446" text-anchor="middle" class="mono">skills · priority</text>
    <text x="830" y="464" text-anchor="middle" class="mono">language</text>
    <text x="830" y="482" text-anchor="middle" class="mono">autoReply · enabled</text>
  </g>

  <!-- Tier 1 -->
  <rect x="300" y="368" width="360" height="52" rx="10" class="lookup"/>
  <text x="480" y="390" text-anchor="middle" class="cap">Tier 1 — Data Table Lookup</text>
  <text x="480" y="409" text-anchor="middle" class="mono">key = toAddress   (support@acme.com)</text>
  <path d="M660 394 H740" class="edgeDot"/>
  <line x1="480" y1="420" x2="480" y2="446" class="edge" marker-end="url(#arrow)"/>
  <text x="496" y="438" class="lbl">no match ↓</text>
  <text x="690" y="388" class="lbl">found →</text>

  <!-- Tier 2 -->
  <rect x="300" y="448" width="360" height="52" rx="10" class="lookup"/>
  <text x="480" y="470" text-anchor="middle" class="cap">Tier 2 — Data Table Lookup</text>
  <text x="480" y="489" text-anchor="middle" class="mono">key = @domain   (@acme.com)</text>
  <path d="M660 474 H760" class="edgeDot"/>
  <line x1="480" y1="500" x2="480" y2="526" class="edge" marker-end="url(#arrow)"/>
  <text x="496" y="518" class="lbl">no match ↓</text>

  <!-- Tier 3 -->
  <rect x="300" y="528" width="360" height="52" rx="10" class="lookup"/>
  <text x="480" y="550" text-anchor="middle" class="cap">Tier 3 — Data Table Lookup</text>
  <text x="480" y="569" text-anchor="middle" class="mono">key = DEFAULT   (org-wide safety net)</text>
  <path d="M660 554 H740" class="edgeDot"/>
  <line x1="480" y1="580" x2="480" y2="606" class="edge" marker-end="url(#arrow)"/>

  <!-- Resolve vars -->
  <rect x="290" y="608" width="380" height="50" rx="10" class="state"/>
  <text x="480" y="630" text-anchor="middle" class="cap">Resolve routing variables</text>
  <text x="480" y="649" text-anchor="middle" class="sub">queue · skills · priority · language · auto-reply</text>
  <line x1="480" y1="658" x2="480" y2="686" class="edge" marker-end="url(#arrow)"/>

  <!-- Gate decision -->
  <polygon points="480,688 640,730 480,772 320,730" class="dec"/>
  <text x="480" y="726" text-anchor="middle" class="cap">matched AND</text>
  <text x="480" y="744" text-anchor="middle" class="cap">enabled ?</text>
  <line x1="480" y1="772" x2="480" y2="800" class="edge" marker-end="url(#arrow)"/>
  <text x="496" y="792" class="lbl">yes ↓</text>

  <!-- no -> unrouted -->
  <line x1="640" y1="730" x2="770" y2="730" class="edgeRed" marker-end="url(#arrowRed)"/>
  <text x="648" y="722" class="lbl">no →</text>

  <!-- Auto reply decision -->
  <polygon points="480,802 620,838 480,874 340,838" class="dec"/>
  <text x="480" y="836" text-anchor="middle" class="cap">autoReply</text>
  <text x="480" y="854" text-anchor="middle" class="cap">Enabled ?</text>
  <line x1="480" y1="874" x2="480" y2="906" class="edge" marker-end="url(#arrow)"/>
  <text x="496" y="898" class="lbl">then ↓</text>

  <!-- Send auto reply (branch) -->
  <rect x="640" y="812" width="230" height="52" rx="10" class="box"/>
  <text x="755" y="834" text-anchor="middle" class="cap">Send Auto Reply</text>
  <text x="755" y="853" text-anchor="middle" class="sub">Response Mgmt response</text>
  <line x1="620" y1="838" x2="640" y2="838" class="edge" marker-end="url(#arrow)"/>
  <text x="600" y="830" class="lbl">yes</text>
  <path d="M755 864 V890 H492" class="edge" marker-end="url(#arrow)"/>

  <!-- Transfer to ACD -->
  <rect x="290" y="908" width="380" height="66" rx="10" class="state"/>
  <text x="480" y="932" text-anchor="middle" class="cap">Transfer to ACD</text>
  <text x="480" y="951" text-anchor="middle" class="mono">FindQueue(queueName)</text>
  <text x="480" y="968" text-anchor="middle" class="sub">skills · priority · language skill</text>
  <line x1="480" y1="974" x2="480" y2="1002" class="edge" marker-end="url(#arrow)"/>
  <text x="496" y="994" class="lbl">success ↓</text>

  <!-- transfer failure -> unrouted -->
  <path d="M670 941 H760" class="edgeRed" marker-end="url(#arrowRed)"/>
  <text x="676" y="933" class="lbl">failure →</text>

  <!-- Queued -->
  <rect x="320" y="1004" width="320" height="46" rx="23" class="ok"/>
  <text x="480" y="1032" text-anchor="middle" class="cap">Queued to agent ✓</text>

  <!-- Unrouted safety net (right) -->
  <rect x="748" y="700" width="222" height="150" rx="10" class="safe"/>
  <text x="859" y="726" text-anchor="middle" class="cap">Unrouted</text>
  <text x="859" y="745" text-anchor="middle" class="sub">(safety net)</text>
  <text x="859" y="775" text-anchor="middle" class="sub">Transfer to</text>
  <text x="859" y="793" text-anchor="middle" class="mono">FindQueue("Email Triage")</text>
  <line x1="859" y1="850" x2="859" y2="884" class="edgeRed" marker-end="url(#arrowRed)"/>
  <text x="875" y="874" class="lbl">on failure</text>

  <!-- Disconnect -->
  <rect x="758" y="886" width="202" height="44" rx="22" class="safe"/>
  <text x="859" y="913" text-anchor="middle" class="cap">Disconnect</text>

  <!-- legend -->
  <text x="30" y="1096" class="note">Most-specific-wins: exact address → @domain → DEFAULT. Onboard/disable a mailbox by editing one data-table row — the flow never changes.</text>
  <rect x="30" y="1110" width="18" height="14" class="lookup"/><text x="54" y="1122" class="sub">Data Table Lookup</text>
  <rect x="190" y="1110" width="18" height="14" class="state"/><text x="214" y="1122" class="sub">Flow action / state</text>
  <rect x="350" y="1110" width="18" height="14" class="dec"/><text x="374" y="1122" class="sub">Decision</text>
  <rect x="470" y="1110" width="18" height="14" class="safe"/><text x="494" y="1122" class="sub">Fail-safe path</text>
  <rect x="600" y="1110" width="18" height="14" class="ok"/><text x="624" y="1122" class="sub">Success</text>
  <rect x="700" y="1110" width="18" height="14" class="dt"/><text x="724" y="1122" class="sub">Data table (control plane)</text>
</svg>
